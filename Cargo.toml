[package]
name = "libwing"
version = "1.0.4"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/dannydulai/libwing"
edition = "2021"
description = "A library for communicationg with the Behringer Wing Digital Mixer"
documentation = "https://docs.rs/libwing"
exclude = [
    "Discovery.md",
    "Wing-Remote-Protocols.pdf",
    "wing.jpg",
    "propmap.jsonl",
    "src/propmap.jsonl",
    "dev/",
]

[features]
default = ["propmap"]
propmap = []

[lib]
name = "libwing"
crate-type = ["rlib", "cdylib"]

[dependencies]
lazy_static = "1.5"
jzon = "0.12.5"
thiserror = "2.0.18"

[dev-dependencies]
eframe = "0.35.0"

[[example]]
name = "wingmeters"
path = "tools/wingmeters.rs"

[[example]]
name = "wingmon"
path = "tools/wingmon.rs"

[[example]]
name = "wingschema"
path = "tools/wingschema.rs"

[[example]]
name = "wingprop"
path = "tools/wingprop.rs"

[[example]]
name = "wingcapture"
path = "tools/wingcapture.rs"
